name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Gradle at Flutter SDK
        run: mkdir -p ~/.gradle && echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> ~/.gradle/gradle.properties

      - name: Regenerate Android scaffold, keep custom code
        run: |
          rm -rf /tmp/custom && mkdir -p /tmp/custom
          cp -r android/app/src/main/kotlin /tmp/custom/
          cp -r android/app/src/main/java /tmp/custom/ || true
          cp -r android/app/src/main/res /tmp/custom/ || true
          cp android/app/src/main/AndroidManifest.xml /tmp/custom/
          rm -rf android
          flutter create --platforms=android --project-name dalahoo_app --org com.example .
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          cp -r /tmp/custom/kotlin android/app/src/main/
          cp -r /tmp/custom/java android/app/src/main/ || true
          cp -r /tmp/custom/res/. android/app/src/main/res/ || true
          cp /tmp/custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
